name: Bons plans (collecte et articles)

# Lancement manuel seulement, tant qu'un premier flux Awin réel n'a pas été vérifié à la main.
# Secrets requis : AWIN_FEED_URL (adresse du datafeed) et une clé Gemini (GEMINI_API_KEY_BONS_PLANS, sinon GEMINI_API_KEY_GENERAL).
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bons-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collecter le flux Awin
        run: node scripts/bons-plans/collecter.mjs
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
      - name: Générer les articles
        run: node scripts/bons-plans/generer.mjs
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
      - name: Enregistrer et relancer le déploiement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bons-plans src/content/bons-plans
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
            exit 0
          fi
          git commit -m "Bons plans (génération automatique)"
          git pull --rebase
          git push
          gh workflow run deploy.yml
